name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit patches against PCSX2's bundled database
        run: |
          git clone --depth 1 https://github.com/PCSX2/pcsx2_patches pcsx2_patches
          (cd pcsx2_patches/patches && zip -q ../../patches.zip *.pnach)
          python tools/audit_pnach.py patches patches.zip
      - name: Build release zip (laid out like the PCSX2 user folder)
        run: |
          mkdir -p dist/pkg/PCSX2
          cp -r patches textures dist/pkg/PCSX2/
          cp README.md LICENSE dist/pkg/
          (cd dist/pkg && zip -qr "../pcsx2-western-controls-${GITHUB_REF_NAME}.zip" .)
          cp patches/*.pnach dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="RELEASE_NOTES/${GITHUB_REF_NAME}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes" \
            dist/*.zip dist/*.pnach
