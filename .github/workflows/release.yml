name: release
# Publishing a release = add RELEASE_NOTES/vX.Y.Z.md and push to main.
# The newest notes file decides the version; nothing happens if that release already exists.
on:
  push:
    branches: [main]
    paths: ["RELEASE_NOTES/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick version from newest release notes
        id: ver
        run: |
          v=$(ls RELEASE_NOTES/v*.md | sed 's#.*/##; s#\.md$##' | sort -V | tail -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "$v" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Audit patches against PCSX2's bundled database
        if: steps.ver.outputs.exists != '1'
        run: |
          git clone --depth 1 https://github.com/PCSX2/pcsx2_patches pcsx2_patches
          (cd pcsx2_patches/patches && zip -q ../../patches.zip *.pnach)
          python tools/audit_pnach.py patches patches.zip
      - name: Build release zip (laid out like the PCSX2 user folder)
        if: steps.ver.outputs.exists != '1'
        run: |
          v=${{ steps.ver.outputs.version }}
          mkdir -p dist/pkg/PCSX2
          cp -r patches textures dist/pkg/PCSX2/
          cp README.md LICENSE dist/pkg/
          (cd dist/pkg && zip -qr "../pcsx2-western-controls-$v.zip" .)
          cp patches/*.pnach dist/
      - name: Publish release
        if: steps.ver.outputs.exists != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.ver.outputs.version }}
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" \
            --notes-file "RELEASE_NOTES/$v.md" dist/*.zip dist/*.pnach
